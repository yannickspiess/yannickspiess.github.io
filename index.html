<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yannick Spiess — Video-Wachstumssysteme</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="colors_and_type.css">
<link rel="stylesheet" href="kit.css">
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="Header.jsx"></script>
  <script type="text/babel" src="Hero.jsx"></script>
  <script type="text/babel" src="WhatThisMeans.jsx"></script>
  <script type="text/babel" src="LoopDiagram.jsx"></script>
  <script type="text/babel" src="HowItWorks.jsx"></script>
  <script type="text/babel" src="Proof.jsx"></script>
  <script type="text/babel" src="ProblemStatements.jsx"></script>
  <script type="text/babel" src="SoftClose.jsx"></script>
  <script type="text/babel" src="Footer.jsx"></script>

  <script type="text/babel">
    // [[VARIABLE]] fills — confirm with Yannick (see Implementation Spec §6)
    const WORDMARK = 'Yannick Spiess';
    const CONTACT  = 'hello@yannickspiess.com'; // placeholder mailto target

    function App() {
      // Scroll-in reveal — quiet entrance, disabled under reduced-motion (CSS handles fallback)
      React.useEffect(() => {
        const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const els = document.querySelectorAll('.reveal');
        if (reduce) { els.forEach((e) => e.classList.add('in')); return; }
        const io = new IntersectionObserver((entries) => {
          entries.forEach((en) => { if (en.isIntersecting) { en.target.classList.add('in'); io.unobserve(en.target); } });
        }, { threshold: 0.12, rootMargin: '0px 0px -8% 0px' });
        els.forEach((e) => io.observe(e));
        return () => io.disconnect();
      }, []);

      return (
        <React.Fragment>
          <Header wordmark={WORDMARK} />
          <main>
            <Hero />
            <PlatformStrip />
            <ProblemStatements />
            <HowItWorks />
            <WhatThisMeans />
            <SoftClose contact={CONTACT} />
          </main>
          <Footer wordmark={WORDMARK} contact={CONTACT} />
        </React.Fragment>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
