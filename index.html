<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yannick Spiess — Video-Wachstumssysteme</title>
<meta name="description" content="Video Ads für Paid Social — Strategie, Produktion und Distribution aus einer Hand. Mach Video zu deinem verlässlichen Kanal für neue Kunden.">

<meta property="og:title" content="Yannick Spiess — Video-Wachstumssysteme">
<meta property="og:description" content="Mach Video zu deinem verlässlichen Kanal für neue Kunden. Strategie, Produktion und Distribution aus einer Hand.">

<link rel="stylesheet" href="colors_and_type.css">
<link rel="stylesheet" href="kit.css">
</head>
<body>
  <div id="root"></div>

  <script src="vendor/react.production.min.js"></script>
  <script src="vendor/react-dom.production.min.js"></script>
  <script src="vendor/babel.min.js"></script>

  <script type="text/babel" src="Header.jsx"></script>
  <script type="text/babel" src="Hero.jsx"></script>
  <script type="text/babel" src="StatCallout.jsx"></script>
  <script type="text/babel" src="LoopDiagram.jsx"></script>
  <script type="text/babel" src="HowItWorks.jsx"></script>
  <script type="text/babel" src="Proof.jsx"></script>
  <script type="text/babel" src="Qualify.jsx"></script>
  <script type="text/babel" src="PilotOffer.jsx"></script>
  <script type="text/babel" src="SoftClose.jsx"></script>
  <script type="text/babel" src="Footer.jsx"></script>

  <script type="text/babel">
    // [[VARIABLE]] fills — confirm with Yannick (see Implementation Spec §6)
    const WORDMARK = 'Yannick Spiess';
    const CONTACT  = 'yannick.spiess@icloud.com'; // temporary; swap when custom domain lands

    function App() {
      // Scroll-in reveal — quiet entrance, disabled under reduced-motion (CSS handles fallback)
      React.useEffect(() => {
        const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const els = document.querySelectorAll('.reveal');
        if (reduce) { els.forEach((e) => e.classList.add('in')); return; }
        const io = new IntersectionObserver((entries) => {
          entries.forEach((en) => { if (en.isIntersecting) { en.target.classList.add('in'); io.unobserve(en.target); } });
        }, { threshold: 0.12, rootMargin: '0px 0px -8% 0px' });
        els.forEach((e) => io.observe(e));
        return () => io.disconnect();
      }, []);

      // Deep-link anchors (/#how etc.): the target doesn't exist until React renders,
      // so the browser's native hash scroll silently no-ops. Re-trigger it after mount.
      React.useEffect(() => {
        if (!window.location.hash) return;
        const target = document.querySelector(window.location.hash);
        if (target) target.scrollIntoView();
      }, []);

      return (
        <React.Fragment>
          <Header wordmark={WORDMARK} />
          <main>
            <Hero />
            <PlatformStrip />
            <StatCallout />
            <HowItWorks />
            <Qualify />
            <PilotOffer />
            <SoftClose />
          </main>
          <Footer wordmark={WORDMARK} contact={CONTACT} />
        </React.Fragment>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
