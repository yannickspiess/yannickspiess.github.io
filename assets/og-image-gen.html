<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=Geist+Mono:wght@500&display=swap');
* { margin: 0; box-sizing: border-box; }
body { width: 1200px; height: 630px; background: #FAF6EF; font-family: 'Bricolage Grotesque', sans-serif; overflow: hidden; }
.card { width: 1200px; height: 630px; padding: 64px 80px 60px; display: flex; flex-direction: column; border-top: 10px solid #E1492A; }
.mark { font-weight: 700; font-size: 28px; letter-spacing: -0.01em; color: #1A1613; }
h1 { font-weight: 800; font-size: 68px; letter-spacing: -0.02em; line-height: 1.06; color: #1A1613; max-width: 18ch; margin-top: 64px; }
h1 .hl { color: #E1492A; }
.foot { margin-top: auto; display: flex; align-items: center; justify-content: space-between; }
.tag { font-family: 'Geist Mono', monospace; font-size: 22px; letter-spacing: 0.04em; color: #6B635A; }
.dot { width: 18px; height: 18px; border-radius: 50%; background: #E1492A; }
</style>
</head>
<body>
  <div class="card">
    <div class="mark">Yannick Spiess</div>
    <h1>Mach <span class="hl">Video</span> zu deinem verlässlichen Kanal für neue Kunden.</h1>
    <div class="foot">
      <span class="tag">Strategie · Produktion · Distribution</span>
      <span class="dot"></span>
    </div>
  </div>
</body>
</html>
